<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#0b1020"><title>Replay Calculator</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:white;font:16px system-ui,Arial}.app{max-width:480px;margin:auto;min-height:100dvh;padding:22px 16px;display:flex;flex-direction:column}header{font-size:25px;font-weight:800;margin-bottom:20px}.tabs{display:flex;gap:7px;margin-bottom:20px}.tabs button{flex:1;font-size:14px;padding:13px 2px}.tabs .active{background:#8068ef}button{border:0;border-radius:16px;background:#1b2440;color:white;font:600 19px system-ui;cursor:pointer;min-height:55px}button:active{filter:brightness(1.3)}.display{background:#1b2440;border-radius:22px;padding:26px 20px;text-align:right;min-height:116px;overflow-wrap:anywhere;margin-bottom:18px}.expression{font-size:27px}.result{color:#b4c1dc;font-size:18px;margin-top:8px}.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.keypad button{height:62px}.operator{background:#384274}.primary{background:#8068ef}.actions{display:flex;gap:9px;margin-top:14px}.actions button{flex:1;font-size:15px}.panel{background:#1b2440;border-radius:18px;padding:16px;margin-bottom:12px}.panel small{color:#b4c1dc}.panel .actions{margin-top:12px}.empty{color:#b4c1dc;padding:25px 8px}.hidden{display:none}h2{font-size:20px}input{background:#26314f;border:1px solid #4a5676;color:white;border-radius:10px;padding:12px;width:100%;font-size:16px;margin:5px 0 12px}dialog{background:#1b2440;color:white;border:0;border-radius:18px;width:min(92%,400px);padding:22px}dialog::backdrop{background:#0009}dialog button{padding:10px 18px;font-size:15px;min-height:45px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}</style><div class="app"><header>Replay Calculator</header><nav class="tabs"><button data-tab="calc" class="active">Calculator</button><button data-tab="recipes">Recipes</button><button data-tab="history">History</button></nav><main id="calc"><div class="display"><div class="expression" id="expression">0</div><div class="result" id="result">Ready</div></div><div class="keypad" id="keypad"></div><div class="actions"><button class="primary" id="calculate">Calculate</button><button id="save">Save formula</button></div></main><main id="recipes" class="hidden"><h2>Saved formulas</h2><div id="recipeList"></div></main><main id="history" class="hidden"><h2>Calculation history</h2><div class="actions"><button id="clearHistory">Clear history</button></div><div id="historyList"></div></main></div><dialog id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="dialog-actions"><button id="cancel">Cancel</button><button class="primary" id="confirm">Save</button></div></dialog><script src="app.js"></script></html>
